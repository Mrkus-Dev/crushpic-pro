name: 'CrushPic Pro'
description: 'Kompres JPG/PNG/WebP/AVIF hingga 80% tanpa loss. Free 100 gambar, Pro unlimited + WebP/AVIF'
author: 'DevOps Market'
branding:
  icon: 'image'
  color: 'purple'
inputs:
  path:
    description: 'Folder gambar'
    required: false
    default: './images'
  quality:
    description: 'Kualitas 1-100'
    required: false
    default: '80'
  pro-key:
    description: 'Lisensi Pro (auto-detect dari GitHub Marketplace jika kosong)'
    required: false
  convert-webp:
    description: 'Convert ke WebP (Pro only)'
    required: false
    default: 'false'
  avif:
    description: 'Convert ke AVIF (Pro only)'
    required: false
    default: 'false'
outputs:
  compressed-count:
    description: 'Jumlah gambar terkompres'
  saved-bytes:
    description: 'Total bytes yang dihemat'
runs:
  using: 'node20'
  main: 'dist/index.js'
